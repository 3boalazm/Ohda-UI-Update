name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: npx tsc --noEmit -p .
      - run: bun run lint
      - run: bunx vitest run --coverage.enabled=false
      - run: bun run build
      - name: No secrets or server-only code in the client bundle
        run: |
          # real keys (not the library's prefix checks), service_role JWT claims in any base64 alignment,
          # PEM keys, and names that must only exist in server code
          if grep -RIl -E "sb_secret_[A-Za-z0-9]{16,}|c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG|BEGIN PRIVATE KEY|get_entitlement_signing_key|redeem_activation_v2|SUPABASE_SERVICE_ROLE_KEY" .output/public; then
            echo "::error::Possible secret or server-only code in public assets"; exit 1
          fi

  e2e:
    name: Browser smoke (CSP, headers, hydration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npx -y playwright@1 install --with-deps chromium
      - name: Run the Worker locally and load every route
        run: |
          npx -y wrangler@4 dev --port 8788 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8788/ && break; sleep 1; done
          npm i --no-save playwright@1
          BASE=http://127.0.0.1:8788 node e2e/csp-smoke.cjs
          BASE=http://127.0.0.1:8788 node e2e/journey.cjs
          BASE=http://127.0.0.1:8788 node e2e/quick-add.cjs

  e2e-family:
    name: Browser E2E (hand-over and the standalone family file)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # demo build: it accepts a sample activation code, because CI has no backend to redeem a real one
      - run: VITE_DEMO_MODE=1 bun run build
      - run: npx -y playwright@1 install --with-deps chromium
      - name: Run the Worker locally and walk the whole hand-over
        run: |
          npx -y wrangler@4 dev --port 8788 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8788/ && break; sleep 1; done
          npm i --no-save playwright@1
          BASE=http://127.0.0.1:8788 node e2e/family.cjs

  database:
    name: RLS and function permission tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations on a Supabase-like stub and run tests
        run: bash db/test/run.sh

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
